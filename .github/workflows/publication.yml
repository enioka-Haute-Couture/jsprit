name: Maven release to OSSRH

on:
    workflow_dispatch:
        inputs:
            releaseVersion:
                description: 'Release version'
                required: true
                default: x.y.z

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            -   uses: actions/checkout@v7

            -   name: Set up Java
                uses: actions/setup-java@v6
                with:
                    java-version: '21'
                    distribution: 'zulu'
                    cache: maven
                    server-id: central
                    server-username-env-var: OSSRH_USERNAME
                    server-password-env-var: OSSRH_PASSWORD
                    gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
                    gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

            -   name: Configure Git User
                run: |
                    git config user.email "actions@github.com"
                    git config user.name "GitHub Actions"

            -   name: Set release version
                run: mvn -B versions:set -DnewVersion=${{ github.event.inputs.releaseVersion }} -DgenerateBackupPoms=false


            -   name: Publish package
                run: mvn deploy -P release
                env:
                    MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
                    OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
                    OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

            -   name: Tag release
                run: |
                    git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
                    git push origin "refs/tags/$RELEASE_VERSION"
                env:
                    RELEASE_VERSION: ${{ github.event.inputs.releaseVersion }}

