name: Build and test
on: push

env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v7
            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    java-version: '21'
                    distribution: 'temurin'
                    server-id: github
            -   name: Build with Maven
                run: mvn --batch-mode --update-snapshots verify
